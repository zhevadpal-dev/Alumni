<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Alumni Tracking System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      max-width: 560px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #0284c7;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    .title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .message {
      color: #475569;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .requested-path {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      background-color: #f1f5f9;
      color: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 28px;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
      width: 100%;
      max-width: 280px;
    }
    .btn-home:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .quick-links {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .quick-links a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .quick-links a:hover {
      color: #2563eb;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8125rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">HTTP 404</span>
    <div class="error-code">404</div>
    <h1 class="title">Page Not Found</h1>
    <p class="message">
      We're sorry, but the page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
    </p>

    <div class="requested-path" id="path-container">
      Requested URL: <span id="path-display">/</span>
    </div>

    <div class="actions">
      <a href="/" class="btn-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Return to Homepage
      </a>
    </div>

    <nav class="quick-links" aria-label="Quick links">
      <a href="/users">Alumni Directory</a>
      <a href="/jobs">Job Postings</a>
      <a href="/announcements">Announcements</a>
      <a href="/applications">Applications</a>
      <a href="/api/swagger">API Docs</a>
    </nav>
  </main>

  <footer class="footer">
    Alumni Tracking System &copy; 2026
  </footer>

  <script>
    (function() {
      var display = document.getElementById('path-display');
      if (display && window.location) {
        display.textContent = window.location.pathname + window.location.search;
      }
    })();
  </script>
</body>
</html>
