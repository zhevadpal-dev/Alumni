<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Alumni Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      box-shadow: none !important;
    }
    body {
      font-family: var(--font-sans, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
      background-color: var(--color-parchment-cream, #f7f6f2);
      color: var(--color-ink, #111111);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--color-canvas-white, #ffffff);
      border: 1px solid var(--color-stone, #d1d4d9) !important;
      border-radius: 16px;
      box-shadow: none !important;
      max-width: 560px;
      width: 100%;
      padding: 44px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .error-code {
      font-family: var(--font-editorial, 'Source Serif 4', Georgia, serif);
      font-size: 5rem;
      font-weight: 400;
      line-height: 1;
      color: var(--color-primary-teal, #1c5d5f);
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }
    .title {
      font-family: var(--font-editorial, 'Source Serif 4', Georgia, serif);
      font-size: 2rem;
      font-weight: 400;
      color: var(--color-ink, #111111);
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    .message {
      color: var(--color-ash, #6d6c6b);
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .requested-path {
      display: inline-block;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.85rem;
      background-color: var(--color-parchment-cream, #f7f6f2);
      color: var(--color-ink, #111111);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-stone, #d1d4d9);
      margin-bottom: 28px;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #16191c !important;
      color: #ffffff !important;
      padding: 12px 28px;
      border-radius: 100px !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid #16191c;
      transition: background-color 0.15s ease;
      width: 100%;
      max-width: 280px;
      box-shadow: none !important;
    }
    .btn-home:hover {
      background-color: #2c3137 !important;
      border-color: #2c3137 !important;
      transform: none !important;
    }
    .quick-links {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--color-stone-light, #e5e7eb);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .quick-links a {
      color: var(--color-ash, #6d6c6b);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .quick-links a:hover {
      color: var(--color-primary-teal, #1c5d5f);
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8125rem;
      color: var(--color-ash, #6d6c6b);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">HTTP 404</span>
    <div class="error-code">404</div>
    <h1 class="title">Page Not Found</h1>
    <p class="message">
      We're sorry, but the page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
    </p>

    <div class="requested-path" id="path-container">
      Requested URL: <span id="path-display">/</span>
    </div>

    <div class="actions">
      <a href="/" class="btn-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Return to Homepage
      </a>
    </div>

    <nav class="quick-links" aria-label="Quick links">
      <a href="/users">Alumni Directory</a>
      <a href="/jobs">Job Postings</a>
      <a href="/announcements">Announcements</a>
      <a href="/applications">Applications</a>
      <a href="/api/swagger">API Docs</a>
    </nav>
  </main>

  <footer class="footer">
    Alumni Tracking System &copy; 2026
  </footer>

  <script>
    (function() {
      var display = document.getElementById('path-display');
      if (display && window.location) {
        display.textContent = window.location.pathname + window.location.search;
      }
    })();
  </script>
</body>
</html>
