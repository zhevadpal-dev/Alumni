services:
  # Node.js Backend Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_app
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5001}
      - HOST=${HOST:-0.0.0.0}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-alumni_db}
      - DB_USER=${DB_USER:-alumni_user}
      - DB_PASSWORD=${DB_PASSWORD:-alumni_secret_password}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${DB_USER:-alumni_user}:${DB_PASSWORD:-alumni_secret_password}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-alumni_db}}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - SWAGGER_ROUTE=${SWAGGER_ROUTE:-/api/swagger}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - alumni_network

  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alumni_db}
      POSTGRES_USER: ${DB_USER:-alumni_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alumni_secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alumni_user} -d ${DB_NAME:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alumni_network

volumes:
  postgres_data:
    driver: local

networks:
  alumni_network:
    driver: bridge
